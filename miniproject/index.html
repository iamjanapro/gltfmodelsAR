<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Vertical Farm Yield Dashboard</title>
    <style>
        /* Simplified CSS Styling for Neatness */
        body {
            font-family: sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            color: #16a085;
            text-align: center;
            margin-bottom: 10px;
        }

        .config-note {
            text-align: center;
            font-size: 0.9em;
            color: #3498db;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #ddd;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #2c3e50;
        }

        /* Input fields are read-only */
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            background-color: #ecf0f1;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background-color: #e8f8f5;
            border: 1px solid #1abc9c;
            border-radius: 8px;
            text-align: center;
            font-size: 1.1em;
            font-weight: 600;
        }

        .live-data {
            font-size: 0.9em;
            color: #7f8c8d;
            margin-bottom: 10px;
        }
        
        .prediction-value {
            color: #e67e22;
            font-size: 1.6em;
            display: block;
            margin-top: 5px;
            font-weight: 900;
        }

        .error {
            color: #e74c3c;
            font-size: 0.9em;
            margin-top: 10px;
            text-align: center;
            font-weight: 600;
        }

        .status-bar {
            text-align: center;
            font-size: 0.9em;
            margin-top: 15px;
            color: #34495e;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🌱 Live Yield Prediction</h2>
        
        <p class="config-note">
            Auto-refreshing every 10 seconds to fetch live data and prediction.
        </p>
        
        <form id="predictionForm">
            
            <div class="form-group">
                <label for="humidity">Live Humidity (%) [V0]</label>
                <input type="number" id="humidity" name="humidity" value="0.0" disabled>
            </div>

            <div class="form-group">
                <label for="temp">Live Temperature (°C) [V1]</label>
                <input type="number" id="temp" name="temp" value="0.0" disabled>
            </div>
            
            </form>

        <div id="result">
            Waiting for first live prediction...
        </div>
        
        <p class="error" id="apiError"></p>
        
        <div class="status-bar" id="statusBar">
            Next update in 10 seconds...
        </div>
    </div>

    <script>
        // --- JavaScript Logic ---
        
        // -------------------------------------------------------------------------------
        // !!! CONFIGURATION: REPLACE THESE VALUES !!!
        // -------------------------------------------------------------------------------

        const BLYNK_DEVICE_ID = "pAAd0KIBKYucdLrgr5g4CqflK0LMo67g"; // ⚠️ REPLACE
        const BLYNK_SERVER = "blynk.cloud"; // ⚠️ REPLACE
        const YIELD_API_URL = "https://6feqblay4h.execute-api.us-east-1.amazonaws.com/v1/predict"; // ⚠️ REPLACE
        
        // New: Set the interval for auto-refresh in milliseconds (10 seconds)
        const AUTO_REFRESH_INTERVAL = 10000; 

        // Individual Blynk API URLs for V0 and V1 (Separate calls as requested)
        const BLYNK_HUMIDITY_URL = `https://${BLYNK_SERVER}/external/api/get?token=${BLYNK_DEVICE_ID}&v0`;
        const BLYNK_TEMPERATURE_URL = `https://${BLYNK_SERVER}/external/api/get?token=${BLYNK_DEVICE_ID}&v1`;

        // -------------------------------------------------------------------------------


        const resultDiv = document.getElementById('result');
        const errorP = document.getElementById('apiError');
        const tempInput = document.getElementById('temp');
        const humidityInput = document.getElementById('humidity');
        const statusBar = document.getElementById('statusBar');
        
        // Set initial values
        tempInput.value = (0.0).toFixed(1);
        humidityInput.value = (0.0).toFixed(1);

        /**
         * Helper function to fetch a single Blynk Virtual Pin value.
         * @param {string} url - The Blynk API URL for the specific pin.
         * @param {string} pinName - Name of the pin for error reporting.
         * @returns {Promise<number>} The numeric value of the pin.
         */
        async function fetchPinValue(url, pinName) {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Blynk API for ${pinName} failed (${response.status}). Check Device ID/Server.`);
            }
            
            const data = await response.text();
            const value = parseFloat(data);
            
            if (isNaN(value)) {
                throw new Error(`Blynk returned non-numeric data for ${pinName}. Data: ${data}`);
            }
            
            return value;
        }

        /**
         * Main function to fetch data, call the API, and update the UI.
         */
        async function getAndPredict() {
            errorP.textContent = ""; // Clear previous errors
            
            try {
                statusBar.textContent = "Fetching live data...";

                // 1. Fetch Live Data from Blynk (V0 and V1 separately)
                const liveHumidity = await fetchPinValue(BLYNK_HUMIDITY_URL, "Humidity (V0)");
                const liveTemperature = await fetchPinValue(BLYNK_TEMPERATURE_URL, "Temperature (V1)");
                
                // Update input fields
                humidityInput.value = liveHumidity.toFixed(1);
                tempInput.value = liveTemperature.toFixed(1);

                statusBar.textContent = "Calling Yield Prediction API...";

                // 2. Call the Yield Prediction API (AWS Gateway)
                const fullUrl = `${YIELD_API_URL}?temp=${liveTemperature}&humidity=${liveHumidity}`;

                const apiResponse = await fetch(fullUrl);
                
                if (!apiResponse.ok) {
                    const errorText = await apiResponse.text();
                    throw new Error(`Yield API Status: ${apiResponse.status}. Response: ${errorText.substring(0, 100)}...`);
                }
                
                const data = await apiResponse.json();

                // 3. Display Result
                if (data.predicted_yield_kg_sq_mt_4_week !== undefined) {
                    const predictedYield = data.predicted_yield_kg_sq_mt_4_week;
                    resultDiv.innerHTML = `
                        <div class="live-data">
                            Data used: Temp **${liveTemperature.toFixed(1)}**°C, Hum **${liveHumidity.toFixed(1)}**%
                        </div>
                        <p style="margin: 0; padding: 0;">Predicted Yield (4-Week):</p>
                        <span class="prediction-value">${predictedYield.toFixed(2)} kg/m²</span>
                    `;
                    statusBar.textContent = `Last update: ${new Date().toLocaleTimeString()}. Next update in 10s...`;
                } else {
                    throw new Error(`Prediction Failed: API response missing 'predicted_yield_kg_sq_mt_4_week' field.`);
                }

            } catch (error) {
                // Log and display error
                console.error('Operation Error:', error);
                errorP.textContent = `Error: ${error.message.substring(0, 100)}`;
                resultDiv.innerHTML = 'Prediction failed. Check configuration and API endpoints.';
                statusBar.textContent = `Error occurred at ${new Date().toLocaleTimeString()}. Retrying in 10s.`;
            }
        }

        // Run the function immediately upon page load
        getAndPredict();

        // Set up the interval to run the function every 10 seconds
        setInterval(getAndPredict, AUTO_REFRESH_INTERVAL);
    </script>
</body>
</html>
